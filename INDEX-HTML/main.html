<script>
    // Check if the user is logged in (i.e., if 'userName' exists in sessionStorage)
    if (sessionStorage.getItem('userName') === null || sessionStorage.getItem('userName') === undefined) {
        // If user is undefined, redirect or show a message
        window.location.href = '../login.html';  // Redirect to the login page or display a message
    } else {
        // Proceed with the application logic if user is defined
        console.log('User is logged in:', sessionStorage.getItem('userName'));
    }
    // Check if the user is logged in
    if (sessionStorage.getItem('isLoggedIn') !== 'true') {
        window.location.href = '../index.html'; // Redirect to login page if not logged in
    } 

    if(sessionStorage.getItem('is_staff') === 'true'){
        window.location.href = 'admin.html';
    }
</script>

    <!-- Include Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>



        function createPieChart(ctx, label, data) {
            new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: ['Checked', 'Not Checked'],
                    datasets: [{
                        label: label,
                        data: data,
                        backgroundColor: ['rgba(54, 162, 235, 0.5)', 'rgba(255, 99, 132, 0.5)'],
                        borderColor: ['rgba(54, 162, 235, 1)', 'rgba(255, 99, 132, 1)'],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }

        async function fetchLineGraphData() {
            try {
                const response = await fetch('../INDEX-PHP/TicketGraph.php'); // Update the path to your PHP script
                const data = await response.json();

                if (!data || !data.labels || !data.datasets) {
                    console.error("Invalid data format:", data);
                    return;
                }

                const ctx = document.getElementById("weeklyRecapChart").getContext("2d");
                new Chart(ctx, {
                    type: "line",
                    data: {
                        labels: data.labels,
                        datasets: data.datasets
                    },
                    options: {
                        maintainAspectRatio: false,
                        responsive: true,
                        plugins: {
                            legend: {
                                display: true
                            }
                        },
                        scales: {
                            x: {
                                title: {
                                    display: true,
                                    text: "Last 7 Days"
                                }
                            },
                            y: {
                                title: {
                                    display: true,
                                    text: "Total Work Done"
                                },
                                beginAtZero: true
                            }
                        }
                    }
                });

            } catch (error) {
                console.error("Fetch error:", error);
            }
        }

        fetchLineGraphData();


        async function fetchChartData() {
            try {
                const response = await fetch('../INDEX-PHP/percentDone.php'); // Replace with actual PHP script path
                const data = await response.json();

                console.log("Fetched Data:", data); // Debugging output

                if (!data || !data.labels || !data.values) {
                    console.error("Invalid data format:", data);
                    return;
                }

                // Render the chart
                const ctx = document.getElementById("PrinterCheck").getContext("2d");
                new Chart(ctx, {
                    type: "pie",
                    data: {
                        labels: data.labels,
                        datasets: [{
                            data: data.values,
                            backgroundColor: ["rgba(54, 162, 235, 0.6)", "rgba(255, 99, 132, 0.6)"],
                            borderColor: "#fff",
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false
                    }
                });

            } catch (error) {
                console.error("Fetch error:", error);
            }
        }

        fetchChartData();

    <script src='https://cdn.jsdelivr.net/npm/js-confetti@latest/dist/js-confetti.browser.js'></script>
    <script>

        // Sidebar toggle/overlay behavior now lives in Wrapper.js (fires on
        // the 'sidebar:ready' event once the shared sidebar is injected).

        document.addEventListener('DOMContentLoaded', function(){
                AnnouncementLoader();
            });
        // Initialize jsConfetti//
        const jsConfetti = new JSConfetti();

        // Add click event listeners to all buttons
        document.querySelectorAll('.submit').forEach(button => {
            button.addEventListener('click', () => {
                // Retrieve the emoji from the data-emoji attribute of the clicked button
                const emoji = button.getAttribute('data-emoji');
                // Trigger the confetti with the specific emoji
                jsConfetti.addConfetti({
                    emojis: [emoji], // Use the emoji as confetti
                    emojiSize: 70,
                    confettiNumber: 40, // Number of confetti particles
                });
            });
        }); 


       function escapeHtml(value) {
            const div = document.createElement('div');
            div.textContent = value ?? '';
            return div.innerHTML;
        }

       function AnnouncementLoader(){
            fetch(`../INDEX-PHP/AcView.php?view=announcement`)
                .then(response=> response.json())
                .then(result=> {
                    if(result.success && Array.isArray(result.data)){
                    const container = document.getElementById('chat-container');

                    result.data.forEach(msg => {
                        const bubble = document.createElement('div');
                        bubble.className = 'bubble.user';

                        bubble.innerHTML = `
                            <div class="subject">${escapeHtml(msg.subject)}<span class="time" style="justify-content: flex-end;">${escapeHtml(msg.time_created)}</span></div>
                            <div class="message">${escapeHtml(msg.text)}</div>

                            <div class="time"><span style="display: flex; justify-content: flex-start;" id="likes${msg.id}"> <a data-role="thumbsUp" style="cursor: pointer;" data-action="like"><i class="fa-solid fa-thumbs-up"></i></a>&nbsp;&nbsp;&nbsp; Liked:  ${escapeHtml(msg.likes)}</span></div>

                            <div class="time"><span style="display: flex; justify-content: flex-start;" id="dislikes${msg.id}"> <a data-role="thumbsDown" style="cursor: pointer;" data-action="dislike"><i class="fa-solid fa-thumbs-down"></i></a>&nbsp;&nbsp;&nbsp;Disliked:  ${escapeHtml(msg.dislikes)}</span></div>
                            <br>
                        `;

                        bubble.querySelector('[data-action="like"]').addEventListener('click', function(){
                            messageInteraction('thumbsUp', msg.text);
                        });
                        bubble.querySelector('[data-action="dislike"]').addEventListener('click', function(){
                            messageInteraction('thumbsDown', msg.text);
                        });

                        container.appendChild(bubble);
                    });
                }
            })
                .catch(error => {
                console.error('Error loading announcements:', error);
            });
        }

        function messageInteraction(action, text){
            const formData = new FormData();
            formData.append('action', action);
            formData.append('text', text);

           fetch('../INDEX-PHP/AcInteraction.php', {
                    method: 'POST',
                    headers: { 'X-CSRF-Token': sessionStorage.getItem('csrfToken') || '' },
                    body: formData
                })
                    .then(response => response.text())
                    .then(data => {
                        document.getElementById('chat-container').innerHTML='';
                        AnnouncementLoader();
                    })
                    .catch(error => {
                        console.error('Error:', error);
                    });
        }

    let refreshTables = 5 * 60 * 1000;

    const trackRefreshTime = () => {
        refreshTime += 1000;
        if(refreshTime >= refreshTables){
           AnnouncementLoader();
        }
    };


    </script>
